name: Dependency cooldown

# Reusable pull request gate. Call it from any repository in the organisation:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, labeled, unlabeled, edited]
#   jobs:
#     dependency-cooldown:
#       uses: Quantus-Network/shared-workflows/.github/workflows/dependency-cooldown.yml@v1
#
# The `labeled` and `edited` types matter: they are what re-runs the gate after
# someone applies the bypass label or writes the bypass reason.
#
# See docs/dependency-cooldown.md for the full adoption guide.

on:
  workflow_call:
    inputs:
      bypass-label:
        description: Pull request label that permits an emergency bypass.
        type: string
        required: false
        default: dependency-cooldown-bypass
      runs-on:
        description: Runner label to execute on.
        type: string
        required: false
        default: ubuntu-latest
      node-version:
        description: Node.js version used to run the checker.
        type: string
        required: false
        default: "22"
    outputs:
      violation-count:
        description: Number of dependency versions younger than the cooldown window.
        value: ${{ jobs.cooldown.outputs.violation-count }}

permissions:
  contents: read

jobs:
  cooldown:
    name: Dependency cooldown
    runs-on: ${{ inputs.runs-on }}
    outputs:
      violation-count: ${{ steps.cooldown.outputs.violation-count }}
    steps:
      # This gate reads the pull request payload for the bypass label, so it is
      # only meaningful on pull_request events. The event name is passed via an
      # environment variable instead of being interpolated into the shell
      # command, to keep the run block free of ${{ }} expansion.
      - name: Reject unsupported events
        if: github.event_name != 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "::error::dependency-cooldown.yml gates pull_request events; got '$EVENT_NAME'. Use dependency-cooldown-audit.yml for scheduled runs."
          exit 1

      # Pinned to a commit SHA (not a mutable tag) so a moved tag cannot inject
      # code into every consuming repository.
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Base lockfiles are read out of git history rather than the diff, so
          # both sides of the pull request must be present locally.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enforce dependency cooldown
        id: cooldown
        # Keep this ref in step with the tag callers use for this workflow.
        uses: Quantus-Network/shared-workflows/actions/dependency-cooldown@v1
        with:
          mode: check
          base-ref: ${{ github.event.pull_request.base.sha }}
          bypass-label: ${{ inputs.bypass-label }}
