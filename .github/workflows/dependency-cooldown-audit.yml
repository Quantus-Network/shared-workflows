name: Dependency cooldown audit

# Reusable, non-blocking audit of every dependency version currently locked on
# the default branch. Call it on a schedule:
#
#   on:
#     schedule:
#       - cron: "0 6 * * 1"
#     workflow_dispatch:
#   jobs:
#     audit:
#       uses: Quantus-Network/shared-workflows/.github/workflows/dependency-cooldown-audit.yml@v1
#
# It exists to show how much of the organisation's locked dependency surface is
# still inside the cooldown window. It never fails the run on a violation.

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        required: false
        default: ubuntu-latest
      node-version:
        type: string
        required: false
        default: "22"
    outputs:
      violation-count:
        description: Locked dependency versions younger than the cooldown window.
        value: ${{ jobs.audit.outputs.violation-count }}

permissions:
  contents: read

jobs:
  audit:
    name: Dependency cooldown audit
    runs-on: ${{ inputs.runs-on }}
    outputs:
      violation-count: ${{ steps.cooldown.outputs.violation-count }}
    steps:
      # Pinned to a commit SHA (not a mutable tag) so a moved tag cannot inject
      # code into consuming repositories.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Audit locked dependency ages
        id: cooldown
        uses: Quantus-Network/shared-workflows/actions/dependency-cooldown@v1
        with:
          mode: audit
